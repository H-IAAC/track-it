name: Tests

on:
  push:
    branches: [main, develop]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    branches: [main, develop]
    paths-ignore: ["**.md", "LICENSE"]

permissions:
  contents: read

jobs:
  # Component unit tests + processed-session data tests. No services needed.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and component deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          # install the components whose code the unit tests import
          pip install -r face_masking_studio/backend/requirements.txt
          pip install -r server-processing/postprocessor/requirements.txt
      - name: Check formatting of the test suite
        run: black --check --diff tests
      - name: Run offline tests with coverage
        run: pytest -m "not integration" --cov=tests --cov-report=term --cov-report=html
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

  # Collective flow: boot the Masking Studio and run the fast integration checks.
  # The slow "every model masks" test needs a real sample video, so it is left
  # for local runs (FMS_SAMPLE_VIDEO=<clip> pytest -m slow).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install -r face_masking_studio/backend/requirements.txt
      - name: Start Face Masking Studio
        working-directory: face_masking_studio/backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 --ws websockets &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/config && break || sleep 1
          done
      - name: Run fast integration tests
        env:
          FMS_URL: http://127.0.0.1:8000
        run: pytest -m "integration and not slow"

  # Android unit tests: build the modules and run their JVM unit tests.
  # Gradle uses JAVA_HOME (temurin JDK 17 below); android_app/gradle.properties
  # no longer hardcodes org.gradle.java.home, so this runs on any machine.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android_app/**/*.gradle*
      - name: Run Android unit tests
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

  # Node preprocessor smoke: it installs, starts, and serves the login page.
  preprocessor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: server-processing/preprocessor/package-lock.json
      - name: Install deps
        working-directory: server-processing/preprocessor
        run: npm install --no-audit --no-fund
      - name: Smoke test (server serves /login)
        run: bash tests/smoke_preprocessor.sh 8099
